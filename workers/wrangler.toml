name = "tu-auditor-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Variables de entorno (reemplazar en producción con wrangler secret put o dashboard)
[vars]
SHEET_MAESTRO = "Maestro_de_Articulos"
SHEET_INVENTARIO = "Inventario_fisico"
SHEET_CONSOLIDACION = "Consolidacion"
CACHE_TTL_SECONDS = "300"
DEBUG = "false"

# SPREADSHEET_ID se define como variable/secreto en producción (no aquí, para evitar colisión) 
# Secreto: GOOGLE_SERVICE_ACCOUNT_JSON se define en el dashboard como secreto (no en vars)
