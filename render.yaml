services:
  - type: web
    name: tu-auditor
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/
    envVars:
      - key: NODE_ENV
        value: production
      - key: SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SHEET_MAESTRO
        value: Maestro_de_Articulos
      - key: SHEET_INVENTARIO
        value: Inventario_fisico
      - key: SHEET_CONSOLIDACION
        value: Consolidacion
      - key: CACHE_TTL_MS
        value: "300000"
      - key: PORT
        value: "4000"
